name: Build Android screen controller
on:
  pull_request:
    paths:
      - controller/**
      - profiles/screen-control.json
      - .github/workflows/screen-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash controller/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-nas-screen
          path: build/pocket-nas-screen.apk
          if-no-files-found: error
